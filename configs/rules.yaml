# Decision Rules Configuration Sheet
# Assessment Requirement M3.1

rules:
  - id: "RULE_01_ENCLOSURE_PASS"
    description: "Valid enclosure detected with high confidence"
    input_class: "enclosure"
    confidence_min: 0.40
    consecutive_frames_required: 3
    action: "PASS"
    actuator_state: "IDLE"
    mqtt_publish: true
    plc_tag_value: 1

  - id: "RULE_02_ABSENT_OR_REJECT"
    description: "No enclosure detected or confidence below threshold"
    input_class: "none"
    confidence_min: 0.0
    consecutive_frames_required: 3
    action: "FAIL"
    actuator_state: "TRIGGER_REJECT"
    mqtt_publish: true
    plc_tag_value: 2

fault_handling:
  camera_failure:
    action: "SYSTEM_HOLD"
    safe_state: "ACTUATORS_DISABLED"
    alarm: true
    plc_tag_value: 99

  inference_failure:
    action: "SYSTEM_HOLD"
    safe_state: "ACTUATORS_DISABLED"
    alarm: true
    plc_tag_value: 98

  sensor_anomaly:
    action: "WARNING_FLAG"
    safe_state: "MAINTAIN_CURRENT"
    alarm: true
    plc_tag_value: 50
